
<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lighthouse Gospel Church</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              apple: {
                light: '#f5f5f7',
                dark: '#000000',
              }
            },
            animation: {
              'apple-fade-in': 'apple-fade-in 0.6s cubic-bezier(0.28, 0.11, 0.32, 1) forwards',
              'apple-slide-up': 'apple-slide-up 0.8s cubic-bezier(0.28, 0.11, 0.32, 1) forwards',
            },
            keyframes: {
              'apple-fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'apple-slide-up': {
                '0%': { opacity: '0', transform: 'translateY(20px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        width: 100%;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.2);
        border-radius: 10px;
      }
      
      .mesh-gradient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        transition: background-image 0.8s ease-in-out, background-color 0.8s ease-in-out;
      }

      /* Dark Mode Mesh */
      .dark .mesh-gradient {
        background-color: #000;
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%), 
          radial-gradient(at 0% 100%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 100%, hsla(253,16%,7%,1) 0, transparent 50%);
      }

      /* Light Mode Mesh */
      .mesh-gradient {
        background-color: #f5f5f7;
        background-image: 
          radial-gradient(at 0% 0%, hsla(200, 100%, 90%, 1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(280, 100%, 95%, 1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(30, 100%, 92%, 1) 0, transparent 50%), 
          radial-gradient(at 0% 100%, hsla(210, 100%, 95%, 1) 0, transparent 50%), 
          radial-gradient(at 100% 100%, hsla(250, 100%, 92%, 1) 0, transparent 50%);
      }

      @keyframes subtle-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .animate-subtle-float {
        animation: subtle-float 4s ease-in-out infinite;
      }

      @keyframes gentle-ring {
        0%, 100% { transform: rotate(0deg); }
        10%, 30%, 50%, 70%, 90% { transform: rotate(-3deg); }
        20%, 40%, 60%, 80% { transform: rotate(3deg); }
      }
      .hover-ring:hover svg {
        animation: gentle-ring 0.6s ease-in-out;
      }

      @keyframes mail-pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.1) translateY(-2px); }
        100% { transform: scale(1); }
      }
      .hover-mail-pop:hover svg {
        animation: mail-pop 0.4s ease-out;
      }

      .ease-apple {
        transition-timing-function: cubic-bezier(0.28, 0.11, 0.32, 1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
  <body class="bg-apple-light dark:bg-apple-dark transition-colors duration-500 overflow-x-hidden">
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
