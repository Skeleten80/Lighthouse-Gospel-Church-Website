<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Lighthouse Gospel Church — A welcoming non-denominational church in Listowel, Ontario. Join us Sundays at 9 AM & 11 AM. Everyone is welcome." />
    <meta name="theme-color" content="#1B3A6B" />
    <title>Lighthouse Gospel Church — Listowel, Ontario</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Playfair Display (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: {
                50:  '#EBF1F8',
                100: '#C8D8EE',
                200: '#A4BDE4',
                300: '#80A2D9',
                400: '#5C87CF',
                500: '#386CC4',
                600: '#2A55A8',
                700: '#1F3F7E',
                800: '#142B54',
                900: '#0D1E3A',
                DEFAULT: '#1B3A6B',
              },
              gold: {
                50:  '#FDF6E8',
                100: '#F8E6C0',
                200: '#F2D498',
                300: '#ECC270',
                400: '#E6B048',
                500: '#C4852A',
                600: '#A36C22',
                700: '#81541A',
                800: '#5F3B11',
                900: '#3D2209',
                DEFAULT: '#C4852A',
              },
              cream: {
                DEFAULT: '#FBF7F0',
                50:  '#FFFFFF',
                100: '#FBF7F0',
                200: '#F5EDD8',
                300: '#EDE0C2',
              },
            },
            fontFamily: {
              heading: ['"Playfair Display"', 'Georgia', 'serif'],
              body:    ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-up':      'fadeUp 0.7s ease forwards',
              'fade-in':      'fadeIn 0.5s ease forwards',
              'beam-sway':    'beamSway 8s ease-in-out infinite alternate',
              'gentle-float': 'gentleFloat 4s ease-in-out infinite',
              'pulse-slow':   'pulse 3s ease-in-out infinite',
            },
            keyframes: {
              fadeUp: {
                '0%':   { opacity: '0', transform: 'translateY(24px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%':   { opacity: '0' },
                '100%': { opacity: '1' },
              },
              beamSway: {
                '0%':   { transform: 'translateX(-50%) rotate(-18deg)' },
                '100%': { transform: 'translateX(-50%) rotate(18deg)' },
              },
              gentleFloat: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%':      { transform: 'translateY(-8px)' },
              },
            },
          },
        },
      }
    </script>

    <style>
      /* ── Base ─────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        background-color: #FBF7F0;
      }
      .dark body { background-color: #0D1E3A; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(27,58,107,.25); border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); }

      /* ── Site-level background ────────────────────────────────────────── */
      .site-bg {
        position: fixed; inset: 0; z-index: -1;
        transition: background 0.6s ease;
      }
      /* Light mode — warm cream with soft gradient blobs */
      .site-bg {
        background-color: #FBF7F0;
        background-image:
          radial-gradient(at 20% 0%,   hsla(220,60%,90%,.55) 0, transparent 55%),
          radial-gradient(at 80% 0%,   hsla(38,80%,90%,.45)  0, transparent 55%),
          radial-gradient(at 0%  80%,  hsla(220,50%,92%,.4)  0, transparent 50%),
          radial-gradient(at 100% 80%, hsla(38,60%,92%,.35)  0, transparent 50%);
      }
      /* Dark mode — deep navy with subtle colour clouds */
      .dark .site-bg {
        background-color: #0D1E3A;
        background-image:
          radial-gradient(at 20% 0%,   hsla(220,60%,20%,.7)  0, transparent 55%),
          radial-gradient(at 80% 0%,   hsla(38,50%,15%,.5)   0, transparent 55%),
          radial-gradient(at 0%  80%,  hsla(220,55%,18%,.55) 0, transparent 50%),
          radial-gradient(at 100% 80%, hsla(215,60%,12%,.6)  0, transparent 50%);
      }

      /* ── Lighthouse beam ──────────────────────────────────────────────── */
      .beam {
        position: absolute;
        top: 0; left: 50%;
        width: 700px; height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(196,133,42,.18) 0%,
          rgba(196,133,42,.06) 40%,
          transparent 80%
        );
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        transform-origin: top center;
        animation: beamSway 8s ease-in-out infinite alternate;
        pointer-events: none;
      }
      @keyframes beamSway {
        0%   { transform: translateX(-50%) rotate(-18deg); }
        100% { transform: translateX(-50%) rotate(18deg); }
      }

      /* ── Typography helpers ───────────────────────────────────────────── */
      .font-heading { font-family: 'Playfair Display', Georgia, serif; }

      /* ── Card glass base ─────────────────────────────────────────────── */
      .card-base {
        background: rgba(255,255,255,.65);
        backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(27,58,107,.08);
        box-shadow: 0 4px 24px rgba(27,58,107,.06);
        border-radius: 1.25rem;
        transition: all .3s ease;
      }
      .dark .card-base {
        background: rgba(20,43,84,.45);
        border-color: rgba(255,255,255,.07);
        box-shadow: 0 8px 40px rgba(0,0,0,.35);
      }
      .card-base:hover {
        box-shadow: 0 8px 40px rgba(27,58,107,.12);
        transform: translateY(-2px);
      }
      .dark .card-base:hover {
        box-shadow: 0 12px 48px rgba(0,0,0,.5);
        border-color: rgba(196,133,42,.2);
      }

      /* ── Button styles ───────────────────────────────────────────────── */
      .btn-primary {
        display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        background: #C4852A; color: #fff; font-weight: 600;
        padding: .75rem 1.75rem; border-radius: .875rem;
        transition: background .2s, transform .15s, box-shadow .2s;
        box-shadow: 0 4px 20px rgba(196,133,42,.35);
        text-decoration: none;
      }
      .btn-primary:hover  { background: #a36c22; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(196,133,42,.45); }
      .btn-primary:active { transform: translateY(0); }

      .btn-secondary {
        display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        background: rgba(255,255,255,.15); color: #fff; font-weight: 600;
        padding: .75rem 1.75rem; border-radius: .875rem;
        border: 1.5px solid rgba(255,255,255,.35);
        transition: background .2s, transform .15s;
        backdrop-filter: blur(8px);
        text-decoration: none;
      }
      .btn-secondary:hover  { background: rgba(255,255,255,.25); transform: translateY(-1px); }
      .btn-secondary:active { transform: translateY(0); }

      .btn-navy {
        display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        background: #1B3A6B; color: #fff; font-weight: 600;
        padding: .75rem 1.75rem; border-radius: .875rem;
        transition: background .2s, transform .15s, box-shadow .2s;
        box-shadow: 0 4px 20px rgba(27,58,107,.3);
        text-decoration: none;
      }
      .btn-navy:hover  { background: #142B54; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(27,58,107,.4); }
      .btn-navy:active { transform: translateY(0); }

      .btn-outline {
        display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
        background: transparent; color: #1B3A6B; font-weight: 600;
        padding: .75rem 1.75rem; border-radius: .875rem;
        border: 1.5px solid #1B3A6B;
        transition: all .2s;
        text-decoration: none;
      }
      .dark .btn-outline { color: #C8D8EE; border-color: rgba(200,216,238,.4); }
      .btn-outline:hover  { background: #1B3A6B; color: #fff; }
      .dark .btn-outline:hover { background: rgba(200,216,238,.1); }

      /* ── Section label ───────────────────────────────────────────────── */
      .section-label {
        display: inline-block;
        font-size: .6875rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
        color: #C4852A;
        padding: .25rem .875rem;
        background: rgba(196,133,42,.1);
        border: 1px solid rgba(196,133,42,.25);
        border-radius: 99px;
      }
      .dark .section-label { background: rgba(196,133,42,.15); }

      /* ── Divider ─────────────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(27,58,107,.12), transparent);
      }
      .dark .divider { background: linear-gradient(to right, transparent, rgba(255,255,255,.08), transparent); }

      /* ── Focus ring (accessibility) ──────────────────────────────────── */
      *:focus-visible {
        outline: 2px solid #C4852A;
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* ── Apple-smooth easing ─────────────────────────────────────────── */
      .ease-church { transition-timing-function: cubic-bezier(0.28, 0.11, 0.32, 1); }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "react-dom/":       "https://esm.sh/react-dom@^19.2.4/",
        "lucide-react":     "https://esm.sh/lucide-react@^0.563.0",
        "react":            "https://esm.sh/react@^19.2.4",
        "react/":           "https://esm.sh/react@^19.2.4/",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "vite": "https://esm.sh/vite@^7.3.1"
      }
    }
    </script>
  </head>

  <body class="transition-colors duration-500 overflow-x-hidden">
    <div class="site-bg" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
